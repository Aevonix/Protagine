name: protagine-memory
version: 1.10.0
description: |
  Native Hermes memory provider for participant-scoped recollection and current
  commitments, preferences and self state. Retrieves source evidence through the
  Protagine sidecar, stamps recall packets for erasure reconciliation, and captures
  durable compression checkpoints. Includes profile-scoped setup and diagnostics.
author: Aevonix
entry_point: __init__.py
category: memory
requires:
  - httpx
  - pydantic
