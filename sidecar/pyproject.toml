[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protagine"
version = "1.10.0"
description = "Persistent identity, memory and autonomy for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# The adapter declares the same range; the documented install picks a 3.12 interpreter.
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "litellm>=1.40",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "websockets>=12.0",
    "Pillow>=10.0",
    "cryptography>=42.0",
    "pypdf>=6.18.0,<7",
    "psutil>=7.2.2,<8; sys_platform == 'darwin'",
    # The vector store is part of every install: a sidecar without it has no semantic
    # recall, and the documented three commands must produce one that does.
    # Metadata-only health scans use the async streaming query API validated on 0.30.2.
    "lancedb>=0.30.2",
    "pyarrow>=15.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
graph = ["neo4j>=5.18"]
# In-process embeddings and reranking; a remote OpenAI-compatible endpoint needs none of it.
vectors = ["sentence-transformers>=3.0"]
hermes = ["protagine-hermes>=1.8.4,<2"]
mcp = ["mcp[cli]>=1.0,<2"]
extraction = ["PyMuPDF>=1.24", "beautifulsoup4>=4.12"]
video = ["av==18.1.0"]
dev = [
    "av==18.1.0",
    "psutil>=7.2.2,<8",
    "neo4j>=5.18",
    "sentence-transformers>=3.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "lancedb>=0.30.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "mcp[cli]>=1.0,<2",
]

[project.scripts]
protagine = "protagine.cli:main"
protagine-inference-pool = "protagine.inference_pool.server:main"

[project.urls]
Homepage = "https://aevonix.com/protagine"
Repository = "https://github.com/Aevonix/Protagine"

[tool.setuptools.packages.find]
where = ["."]
include = ["protagine*"]
exclude = ["*.tests", "*.tests.*", "*.test_*", "*.conftest"]

[tool.setuptools.package-data]
protagine = ["**/*.sql", "**/*.json", "**/*.yaml", "**/*.txt", "qualification/fixtures/*.png", "service_template.plist"]
