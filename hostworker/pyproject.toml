[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protagine-hostworker"
version = "0.3.1rc1"
description = "Stateless, stdlib-only core for governed Protagine host workers"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Deliberately empty: this distribution is stdlib-only and must never grow a
# dependency on FastAPI or protagine (see protagine_hostworker/contract.py).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://aevonix.com/protagine"
Repository = "https://github.com/Aevonix/Protagine"

[tool.setuptools.packages.find]
where = ["."]
include = ["protagine_hostworker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
