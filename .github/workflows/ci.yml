name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A tagged release runs these same checks on its own commit and publishes
  # the resulting artifacts, rather than rebuilding after qualification.
  workflow_call:

env:
  # Stock Hermes v2026.9.14 (0.21.3): the qualified release of the supported range >=0.21.3,<0.22.
  HERMES_REF: 345cd2b057a452236de401d3534b8502a7465e8d

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/release-py312.txt
      - name: Install qualified build and quality tools
        run: python -m pip install -c requirements/release-py312.txt '.[test,quality]'
      - name: Check fatal errors
        run: python -m ruff check sidecar/protagine plugins/hermes-plugin plugins/protagine-memory scripts/qualify_artifacts.py scripts/check_hermes_record.py scripts/fake_model.py tests/hermes_adapter
      - name: Build distributions from source archives
        run: |
          python -m build --no-isolation --outdir dist .
          python -m build --no-isolation --outdir dist ./sidecar
          python -m twine check dist/*
      - name: Qualify installed artifacts and record resolved dependencies
        run: |
          python scripts/qualify_artifacts.py --dist dist --constraints requirements/release-py312.txt --output artifact-qualification
          python -m pip list --format=json > artifact-qualification/build-packages.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-qualification
          path: artifact-qualification/
          if-no-files-found: warn

  # The plan's fresh-install test: stock Hermes in its own environment, the
  # built wheels, init, pip check, RECORD, upgrade twice, doctor, uninstall.
  fresh-install:
    runs-on: ubuntu-latest
    needs: artifacts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: .qualification/hermes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install, check, upgrade twice, uninstall against stock Hermes
        env:
          HERMES_SRC: ${{ github.workspace }}/.qualification/hermes
          DIST_DIR: ${{ github.workspace }}/dist
        run: bash scripts/ci_fresh_install.sh
      - name: Remember in one session, recall in another (acceptance test 1)
        env:
          HERMES_SRC: ${{ github.workspace }}/.qualification/hermes
          DIST_DIR: ${{ github.workspace }}/dist
        run: bash scripts/ci_recall_probe.sh
      - name: The first closed loop on stock Hermes (build plan M2 acceptance)
        env:
          HERMES_SRC: ${{ github.workspace }}/.qualification/hermes
          DIST_DIR: ${{ github.workspace }}/dist
        run: bash scripts/ci_mind_loop.sh

  hermes-adapter:
    runs-on: ubuntu-latest
    needs: artifacts
    env:
      PROTAGINE_DISTRIBUTIONS_DIR: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - uses: actions/checkout@v6
        with:
          # Stock Hermes, exactly as a user installs it. No patches are applied.
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: .qualification/hermes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sidecar/pyproject.toml
            .qualification/hermes/pyproject.toml
      - name: Install stock Hermes and the built adapter
        run: |
          python -m pip install -e ./.qualification/hermes
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          adapter, = Path('dist').glob('protagine_hermes-*.whl')
          sidecar, = Path('dist').glob('protagine-*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(adapter) + '[test]', str(sidecar) + '[lancedb]'], check=True)
          PY
          python -m pip check
      - name: Qualify the adapter against stock Hermes
        run: python -m pytest tests/hermes_adapter -q --durations=0 --junitxml=hermes-adapter-results.xml
      - name: Qualify the recall harness
        run: python -m pytest benchmarks/source_recall/test_harness.py -q --durations=0 --junitxml=source-recall-results.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-adapter-results
          path: '*-results*.xml'

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: .qualification/hermes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/pyproject.toml
      - name: Install the sidecar and a stock Hermes for the install tests
        run: |
          pip install -e "./sidecar[dev]" -e .
          python -m venv .qualification/hermes-venv
          .qualification/hermes-venv/bin/python -m pip install --quiet --upgrade pip
          .qualification/hermes-venv/bin/python -m pip install --quiet -e ./.qualification/hermes .
      - name: Run tests
        env:
          PROTAGINE_TEST_HERMES_PYTHON: ${{ github.workspace }}/.qualification/hermes-venv/bin/python
        working-directory: sidecar
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build sidecar image
        uses: docker/build-push-action@v7
        with:
          context: ./sidecar
          push: false
          tags: protagine-qualified:${{ github.sha }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/') && format('type=docker,dest={0}/sidecar-image.tar', runner.temp) || '' }}
      - name: Check the release container entry point
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker load --input "${RUNNER_TEMP}/sidecar-image.tar"
          docker run --rm --network none --entrypoint protagine "protagine-qualified:${GITHUB_SHA}" --help
          docker image inspect "protagine-qualified:${GITHUB_SHA}" --format '{{.Id}}' > "${RUNNER_TEMP}/sidecar-image-id.txt"
      - name: Retain the qualified release image
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-container
          path: |
            ${{ runner.temp }}/sidecar-image.tar
            ${{ runner.temp }}/sidecar-image-id.txt
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
