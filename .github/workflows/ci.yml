name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A tagged release runs these same checks on its own commit and publishes
  # the resulting artifacts, rather than rebuilding after qualification.
  workflow_call:

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/release-py312.txt
      - name: Install qualified build and quality tools
        run: python -m pip install -c requirements/release-py312.txt '.[test,quality]'
      - name: Check fatal errors and the hostworker contract types
        run: |
          python -m ruff check scripts/qualify_artifacts.py hostworker/protagine_hostworker tests/hermes_adapter/conftest.py tests/hermes_adapter/test_sidecar_distribution.py
          python -m mypy
      - name: Build distributions from source archives
        run: |
          python -m build --no-isolation --outdir dist .
          python -m build --no-isolation --outdir dist ./sidecar
          python -m build --no-isolation --outdir dist ./hostworker
          python -m twine check dist/*
      - name: Qualify installed artifacts and record resolved dependencies
        run: |
          python scripts/qualify_artifacts.py --dist dist --constraints requirements/release-py312.txt --output artifact-qualification
          python -m pip list --format=json > artifact-qualification/build-packages.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-qualification
          path: artifact-qualification/
          if-no-files-found: warn

  hermes-adapter-partition:
    name: hermes-adapter (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        group: [native, integration]
    env:
      QUALIFICATION_GROUP: ${{ matrix.group }}
      PROTAGINE_TEST_HERMES_PATH: ${{ github.workspace }}/.qualification/hermes
      HERMES_TEST_SOURCE: ${{ github.workspace }}/.qualification/hermes
      PROTAGINE_HERMES_TEST_SOURCE: ${{ github.workspace }}/.qualification/hermes
      PROTAGINE_DISTRIBUTIONS_DIR: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - uses: actions/checkout@v6
        with:
          # Same official source + packaged patches used by guided installation.
          repository: NousResearch/hermes-agent
          ref: 345cd2b057a452236de401d3534b8502a7465e8d
          path: .qualification/hermes-official
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sidecar/pyproject.toml
            .qualification/hermes-official/pyproject.toml
      - name: Apply the built distribution's versioned Hermes patches
        run: |
          python -m pip install --no-deps dist/protagine-*.whl
          python -m protagine.hermes_patches --source .qualification/hermes-official --destination .qualification/hermes --include-regressions > hermes-patches.json
      - name: Install adapter and pinned native runtime
        run: |
          python -m pip install -e ".[test,native-memory]"
          python -m pip install -e ./.qualification/hermes
          python -m pip install './sidecar[lancedb,video]' 'pytest-asyncio>=0.23'
      - name: Qualify built artifacts and profile isolation
        run: |
          export PROTAGINE_HERMES_TEST_PYTHON="$(command -v python)"
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          group = os.environ['QUALIFICATION_GROUP']
          # Each matrix job has its own checkout/native install and uses the
          # same prepared release artifacts.
          # Include both default pytest filename patterns so new tests cannot
          # silently fall outside the two complementary groups.
          files = sorted(path for path in Path('tests/hermes_adapter').rglob('*.py')
                         if path.name.startswith('test_') or path.name.endswith('_test.py'))
          selected = [str(path) for path in files
                      if path.name.startswith('test_native_') == (group == 'native')]
          assert group in ('native', 'integration') and selected
          Path(f'hermes-adapter-inventory-{group}.json').write_text(json.dumps(selected, indent=2) + '\n')
          subprocess.run([sys.executable, '-m', 'pytest', *selected, '-q', '--durations=0',
                          f'--junitxml=hermes-adapter-results-{group}.xml'], check=True)
          PY
      - name: Require the patched runtime contract
        if: matrix.group == 'native'
        run: |
          python -m protagine.hermes_capabilities --output hermes-capabilities.json --require core --require concurrent_work --require detached_review --require source_reminders --require terminal_handoff
          python scripts/qualify_hermes_patch_regressions.py --runtime .qualification/hermes --output hermes-patch-regressions
      - name: Require native qualification witnesses
        if: matrix.group == 'native'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          collected = list(ET.parse('hermes-adapter-results-native.xml').iter('testcase'))
          for module, name, expected in (
              ('test_native_task_channels', 'test_native_task_channels', 7),
              ('test_native_review_boundary', 'test_native_executor_read_only_review', 2),
              ('test_native_skill_catalog', 'test_native_skill_index_and_view_remain_authoritative', 1),
              ('test_native_skill_updates', 'test_native_skill_updates_reach_running_and_saved_conversations', 2),
              ('test_native_source_reminders', 'test_native_source_deadline_correction_and_forgetting', 2),
          ):
              cases = [case for case in collected
                       if case.get('classname', '').endswith('.' + module)
                       and (case.get('name') == name or case.get('name', '').startswith(name + '['))]
              assert len(cases) == expected, f'{name}: expected {expected} cases, found {len(cases)}'
              assert not any(case.find(outcome) is not None for case in cases for outcome in ('skipped', 'failure', 'error')), \
                  f'{name} must run and pass'
          PY
      - name: Qualify host worker and recall harness
        if: matrix.group == 'integration'
        run: |
          export PROTAGINE_HERMES_TEST_PYTHON="$(command -v python)"
          python -m pytest hostworker/tests -q --durations=0 --junitxml=hostworker-results.xml
          python -m pytest benchmarks/source_recall/test_harness.py -q --durations=0 --junitxml=source-recall-results.xml
      - name: Qualify native original-memory observations
        if: matrix.group == 'native'
        env:
          PYTHONPATH: ${{ github.workspace }}/.qualification/hermes
        run: |
          python -c "from hermes_state import SessionDB; assert all(callable(getattr(SessionDB, name, None)) for name in ('redact_message_payloads', 'message_redaction_snapshot'))"
          python -m pytest sidecar/tests/test_native_tool_observations.py sidecar/tests/test_native_owned_copies.py sidecar/tests/test_native_instruction_ownership.py sidecar/tests/test_native_profile_scope.py sidecar/tests/test_cron_memory_lineage.py sidecar/tests/test_task_execution_judgments.py -q --durations=0 --junitxml=native-memory-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = [case for case in ET.parse('native-memory-results.xml').iter('testcase')
                   if case.get('classname', '').endswith('test_native_profile_scope')]
          assert len(cases) == 41, f'Expected 41 native profile scope witnesses, found {len(cases)}'
          assert not any(case.find(state) is not None for case in cases
                         for state in ('skipped', 'failure', 'error')), 'Profile scope witnesses must run and pass'
          PY
      - name: Retain test inventory and durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-adapter-${{ matrix.group }}-results
          path: |
            hermes-adapter-inventory-*.json
            *-results*.xml
            hermes-patches.json
            hermes-capabilities.json
            hermes-patch-regressions/

  # Preserve the existing required check name. Both isolated test jobs must
  # succeed; a failed, cancelled or skipped partition cannot satisfy it.
  hermes-adapter:
    if: always()
    needs: hermes-adapter-partition
    runs-on: ubuntu-latest
    steps:
      - name: Require both adapter partitions
        env:
          PARTITION_RESULT: ${{ needs.hermes-adapter-partition.result }}
        run: test "$PARTITION_RESULT" = success

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build sidecar image
        uses: docker/build-push-action@v7
        with:
          context: ./sidecar
          push: false
          tags: protagine-qualified:${{ github.sha }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/') && format('type=docker,dest={0}/sidecar-image.tar', runner.temp) || '' }}
      - name: Check the release container entry point
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker load --input "${RUNNER_TEMP}/sidecar-image.tar"
          docker run --rm --network none --entrypoint protagine "protagine-qualified:${GITHUB_SHA}" --help
          docker image inspect "protagine-qualified:${GITHUB_SHA}" --format '{{.Id}}' > "${RUNNER_TEMP}/sidecar-image-id.txt"
      - name: Retain the qualified release image
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-container
          path: |
            ${{ runner.temp }}/sidecar-image.tar
            ${{ runner.temp }}/sidecar-image-id.txt
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
