name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  qualification:
    uses: ./.github/workflows/ci.yml

  # --- Canonical adapter and sidecar → PyPI ---
  pypi:
    needs: qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish to PyPI
        # Trusted publishing (OIDC): PyPI is configured with a GitHub
        # publisher for this repository and workflow, so no API token is
        # stored here. The id-token: write permission is inherited above.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Re-running a release (e.g. to recover a failed later job) must not
          # fail just because this version is already on PyPI.
          skip-existing: true

  # --- Docker image → GHCR ---
  docker:
    needs: qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-container
          path: qualified-image/
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image built by qualification
        run: |
          docker load --input qualified-image/sidecar-image.tar
          docker tag "protagine-qualified:${GITHUB_SHA}" "ghcr.io/aevonix/protagine:${GITHUB_REF_NAME}"
          docker tag "protagine-qualified:${GITHUB_SHA}" ghcr.io/aevonix/protagine:latest
          docker push "ghcr.io/aevonix/protagine:${GITHUB_REF_NAME}"
          docker push ghcr.io/aevonix/protagine:latest

  # --- GitHub Release ← tag + CHANGELOG ---
  # Runs only after PyPI and GHCR publish, so the Release never points at
  # artifacts that failed to ship.
  github-release:
    needs: [pypi, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub Release from tag + CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Extract this version's section from CHANGELOG.md.
          # Headings are "## <tag> — <title>"; capture until the next "## ".
          awk -v tag="$tag" '
            /^## / { if ($2 == tag) { f=1; next } else if (f) { f=0 } }
            f { print }
          ' CHANGELOG.md > notes.md
          sed -i -e '/./,$!d' notes.md            # drop leading blank lines
          [ -s notes.md ] || echo "Release $tag" > notes.md
          title="$(grep -m1 "^## ${tag} " CHANGELOG.md | sed 's/^## //')"
          [ -n "$title" ] || title="$tag"
          # Idempotent: edit an existing Release on re-run, otherwise create it.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file notes.md
          else
            gh release create "$tag" --title "$title" --notes-file notes.md --verify-tag
          fi
