name: Latest Hermes patch compatibility

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-hermes-compatibility
  cancel-in-progress: true

jobs:
  latest-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Select the latest published stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          release = json.loads(subprocess.check_output([
              'gh', 'api', 'repos/NousResearch/hermes-agent/releases/latest']))
          tag = release['tag_name']
          assert tag and '\n' not in tag and '\r' not in tag
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('tag=' + tag + '\n')
          PY
      - uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.release.outputs.tag }}
          path: .qualification/hermes-official
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sidecar/pyproject.toml
            .qualification/hermes-official/pyproject.toml
      - name: Record the selected runtime
        env:
          HERMES_RELEASE: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PY'
          import os, subprocess
          revision = subprocess.check_output([
              'git', '-C', '.qualification/hermes-official', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Hermes release: ' + os.environ['HERMES_RELEASE'] + '\n\n')
              stream.write('Exact commit: `' + revision + '`\n\n')
              stream.write('Official release plus shipped Protagine patches. No deployment or pin is changed.\n')
          PY
      - name: Check and stage the shipped patches on the latest official release
        run: |
          python -m pip install --no-deps ./sidecar
          python -m protagine.hermes_patches --source .qualification/hermes-official --destination .qualification/hermes --include-regressions > upstream-patches.json
      - name: Install adapter and selected native runtime
        id: install
        run: |
          python -m pip install -e '.[test,native-memory]'
          python -m pip install -e ./.qualification/hermes
          python -m pip install ./sidecar
      - name: Record core and optional native capabilities
        run: |
          python -m protagine.hermes_capabilities --output upstream-capabilities.json --require core --require concurrent_work --require detached_review --require source_reminders --require terminal_handoff
          python - <<'PY'
          import json, os
          report = json.load(open('upstream-capabilities.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              for name, feature in report['features'].items():
                  status = 'available' if feature['available'] else 'missing: ' + ', '.join(feature['missing'])
                  stream.write(f'- {name}: {status}\n')
              stream.write('\nInterface checks do not replace installed-adapter behavior qualification.\n')
          PY
      - name: Qualify built artifacts against the patched latest stable Hermes
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          export PROTAGINE_HERMES_TEST_PYTHON="$(command -v python)"
          python -m pytest tests/hermes_adapter -q -ra --junitxml=upstream-adapter.xml
      - name: Require core interfaces independently of optional feature results
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m protagine.hermes_capabilities --require core
      - name: Qualify each native patch regression in a fresh process
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/qualify_hermes_patch_regressions.py --runtime .qualification/hermes --output upstream-patch-regressions
      - name: Retain runtime receipt and every test outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-hermes-qualification
          path: |
            upstream-capabilities.json
            upstream-adapter.xml
            upstream-patches.json
            upstream-patch-regressions/
          if-no-files-found: warn
