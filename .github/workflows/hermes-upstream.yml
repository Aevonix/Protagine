name: Latest Hermes compatibility

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-hermes-compatibility
  cancel-in-progress: true

jobs:
  latest-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Select the latest published stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          release = json.loads(subprocess.check_output([
              'gh', 'api', 'repos/NousResearch/hermes-agent/releases/latest']))
          tag = release['tag_name']
          assert tag and '\n' not in tag and '\r' not in tag
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('tag=' + tag + '\n')
          PY
      - uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.release.outputs.tag }}
          path: .qualification/hermes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sidecar/pyproject.toml
            .qualification/hermes/pyproject.toml
      - name: Record the selected runtime
        env:
          HERMES_RELEASE: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PY'
          import os, subprocess
          revision = subprocess.check_output([
              'git', '-C', '.qualification/hermes', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Hermes release: ' + os.environ['HERMES_RELEASE'] + '\n\n')
              stream.write('Exact commit: `' + revision + '`\n\n')
              stream.write('Stock upstream release, no patches. No deployment or pin is changed.\n')
          PY
      - name: Build the distributions
        run: |
          python -m pip install build "setuptools>=77" wheel
          python -m build --no-isolation --outdir dist .
          python -m build --no-isolation --outdir dist ./sidecar
      - name: Fresh install against the latest stock release
        id: install
        env:
          HERMES_SRC: ${{ github.workspace }}/.qualification/hermes
          DIST_DIR: ${{ github.workspace }}/dist
        run: bash scripts/ci_fresh_install.sh
      - name: Install adapter, sidecar and the latest stock Hermes for the adapter tests
        id: adapter
        run: |
          python -m pip install -e '.[test,native-memory]'
          python -m pip install -e ./.qualification/hermes
          python -m pip install ./sidecar
      - name: Qualify built artifacts against the latest stock Hermes
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        run: python -m pytest tests/hermes_adapter -q -ra --junitxml=upstream-adapter.xml
      - name: Retain every test outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-hermes-qualification
          path: |
            upstream-adapter.xml
          if-no-files-found: warn
